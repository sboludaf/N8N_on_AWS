AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploy N8N workflow automation tool on AWS ECS Fargate with EFS storage'

Parameters:
  InstanceName:
    Type: String
    Description: 'Unique name for this N8N instance (used to avoid resource collisions)'
    Default: 'default'
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]*$'
    ConstraintDescription: 'Must start with a letter and contain only alphanumeric characters and hyphens'
  
  DomainName:
    Type: String
    Description: 'Domain name for N8N (optional, leave empty if not using custom domain)'
    Default: ''
  
  CertificateArn:
    Type: String
    Description: 'ACM Certificate ARN for HTTPS (optional, leave empty if not using SSL)'
    Default: ''
  
  N8NImage:
    Type: String
    Description: 'N8N Docker image'
    Default: 'docker.n8n.io/n8nio/n8n:latest'
  
  TaskCpu:
    Type: Number
    Description: 'CPU units for the task (1024 = 1 vCPU)'
    Default: 1024
    AllowedValues: [256, 512, 1024, 2048, 4096]
  
  TaskMemory:
    Type: Number
    Description: 'Memory for the task in MB'
    Default: 3072
    AllowedValues: [512, 1024, 2048, 3072, 4096, 5120, 6144, 7168, 8192]

Conditions:
  HasDomainName: !Not [!Equals [!Ref DomainName, '']]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # VPC and Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-VPC'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-IGW'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName} Public Subnet (AZ1)'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName} Public Subnet (AZ2)'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.11.0/24
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName} Private Subnet (AZ1)'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.12.0/24
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName} Private Subnet (AZ2)'

  # NAT Gateways removed to reduce costs
  # ECS will run in public subnets instead

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName} Public Routes'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # Private route tables removed since NAT Gateways are not used
  # Private subnets remain available but without internet routing

  # Security Groups
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'N8N-${InstanceName}-LoadBalancer-SG'
      GroupDescription: !Sub 'Security group for N8N ${InstanceName} Load Balancer'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-LoadBalancer-SG'

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'N8N-${InstanceName}-ECS-SG'
      GroupDescription: !Sub 'Security group for N8N ${InstanceName} ECS tasks'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5678
          ToPort: 5678
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-ECS-SG'

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'N8N-${InstanceName}-EFS-SG'
      GroupDescription: !Sub 'Security group for N8N ${InstanceName} EFS'
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-EFS-SG'

  # Security Group Rules to avoid circular dependency
  ECSToEFSRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !Ref EFSSecurityGroup

  ECSHTTPSEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: 'HTTPS outbound for Docker image pulls from docker.n8n.io'

  ECSHTTPEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ECSSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: 'HTTP outbound for package downloads'

  EFSFromECSRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EFSSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref ECSSecurityGroup

  # EFS File System
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-EFS'

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: 1000
        Gid: 1000
      RootDirectory:
        CreationInfo:
          OwnerUid: 1000
          OwnerGid: 1000
          Permissions: '0755'
        Path: '/n8n'
      AccessPointTags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-EFS-AccessPoint'

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-${InstanceName}-n8n-cluster'
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-ECS-Cluster'

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-ECS-TaskExecutionRole'

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EFSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource: !Sub '${EFSFileSystem.Arn}/*'
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-ECS-TaskRole'

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}-${InstanceName}-n8n'
      RetentionInDays: 14

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-${InstanceName}-n8n-task'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: n8n
          Image: !Ref N8NImage
          Essential: true
          PortMappings:
            - ContainerPort: 5678
              Protocol: tcp
          Environment:
            - Name: N8N_HOST
              Value: '0.0.0.0'
            - Name: N8N_PORT
              Value: '5678'
            - Name: N8N_PROTOCOL
              Value: !If [HasCertificate, 'https', 'http']
            - Name: WEBHOOK_URL
              Value: !Sub 
                - '${Protocol}://${Host}'
                - Protocol: !If [HasCertificate, 'https', 'http']
                  Host: !If [HasDomainName, !Ref DomainName, !GetAtt LoadBalancer.DNSName]
            - Name: GENERIC_TIMEZONE
              Value: 'UTC'
            - Name: N8N_EDITOR_BASE_URL
              Value: !Sub 
                - '${Protocol}://${Host}'
                - Protocol: !If [HasCertificate, 'https', 'http']
                  Host: !If [HasDomainName, !Ref DomainName, !GetAtt LoadBalancer.DNSName]
          MountPoints:
            - SourceVolume: n8n-data
              ContainerPath: /home/node/.n8n
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Volumes:
        - Name: n8n-data
          EFSVolumeConfiguration:
            FileSystemId: !Ref EFSFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EFSAccessPoint
              IAM: ENABLED
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-TaskDefinition'

  # Application Load Balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-${InstanceName}-n8n-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-LoadBalancer'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-${InstanceName}-n8n-tg'
      Port: 5678
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-TargetGroup'

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: !If [HasCertificate, 'redirect', 'forward']
          RedirectConfig: !If
            - HasCertificate
            - Protocol: HTTPS
              Port: 443
              StatusCode: HTTP_301
            - !Ref AWS::NoValue
          TargetGroupArn: !If [HasCertificate, !Ref AWS::NoValue, !Ref TargetGroup]
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: HTTPListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-${InstanceName}-n8n-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      LoadBalancers:
        - ContainerName: n8n
          ContainerPort: 5678
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: Name
          Value: !Sub 'N8N-${InstanceName}-ECS-Service'

Outputs:
  LoadBalancerDNS:
    Description: 'DNS name of the load balancer'
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-${InstanceName}-LoadBalancerDNS'

  LoadBalancerURL:
    Description: 'URL to access N8N'
    Value: !Sub 
      - '${Protocol}://${DNS}'
      - Protocol: !If [HasCertificate, 'https', 'http']
        DNS: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-${InstanceName}-LoadBalancerURL'

  EFSFileSystemId:
    Description: 'EFS File System ID'
    Value: !Ref EFSFileSystem
    Export:
      Name: !Sub '${AWS::StackName}-${InstanceName}-EFSFileSystemId'

  ECSClusterName:
    Description: 'ECS Cluster Name'
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-${InstanceName}-ECSClusterName'

  VPCId:
    Description: 'VPC ID'
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-${InstanceName}-VPCId'
